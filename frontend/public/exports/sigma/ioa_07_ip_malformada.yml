title: Registro con IP escrita sin puntos
id: 0540f8cd-0424-50d5-aa0c-dee43dcef3e4
name: aegis_ioa07_ip_malformada
status: experimental
description: IP de conexión con formato anómalo (11 dígitos sin puntos). Posible manipulación
  de registros o evasión de herramientas que validan IPs. Requiere análisis.
author: Equipo AegisHealth-CTI (Hackatón IESS 2026)
date: '2026-11-26'
tags:
- attack.defense-evasion
logsource:
  product: aegishealth
  service: sistema_medico
detection:
  seleccion:
    conn_ip_raw|re: ^10\d{9}$
  condition: seleccion
falsepositives:
- Errores de integración entre sistemas
level: medium
