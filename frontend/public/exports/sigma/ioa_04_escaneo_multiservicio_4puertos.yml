title: Conexión negada a servicio crítico (base)
id: b8969bc5-edd7-58ca-8df4-41399b704baa
name: aegis_ioa04_negada_puerto_critico
status: experimental
description: 'Evento base: conexión negada a un puerto de administración remota o
  base de datos.'
author: Equipo AegisHealth-CTI (Hackatón IESS 2026)
date: '2026-11-26'
tags:
- attack.discovery
logsource:
  product: aegishealth
  category: firewall
detection:
  seleccion:
    action: negado
    dst_port:
    - 22
    - 23
    - 135
    - 137
    - 139
    - 445
    - 1433
    - 1521
    - 3306
    - 3389
    - 5432
    - 5985
    - 5986
    - 8471
