title: Escaneo de varios servicios críticos
id: 70bb375e-7cf5-521f-8400-9049a73bafce
name: aegis_ioa04_escaneo_multiservicio
status: experimental
description: Una misma IP intenta 4 o más servicios críticos distintos en 1 hora.
author: Equipo AegisHealth-CTI (Hackatón IESS 2026)
date: '2026-11-26'
tags:
- attack.discovery
- attack.t1046
correlation:
  type: value_count
  rules:
  - aegis_ioa04_negada_puerto_critico
  group-by:
  - src_ip
  timespan: 1h
  condition:
    field: dst_port
    gte: 4
level: high
